# Single source of truth for the paper list. README sections are generated
# from this file by scripts/build_readme.py. Do not edit the generated parts
# of README.md by hand.
#
# Fields
#   id          short unique key (used by latency.yaml)
#   title       exact paper title
#   authors     "First Author et al." is fine
#   year        first public year
#   venue       peer-reviewed venue, or "arXiv" / "Tech report" / "Blog"
#   arxiv       arXiv id without version, if any
#   url         project page or paper URL if no arXiv id
#   code        code URL if released
#   categories  taxonomy codes from data/taxonomy.yaml; first code = primary
#   note        one line, your own words, what it contributes to THIS list
#   verified    true only after you have opened the paper and checked
#               title, authors, venue, id and that the note is accurate.
#               Unverified entries are listed with a marker in the README.
#
# Entries below were seeded from memory and the original README. Run
# scripts/check_arxiv.py, then read each paper before setting verified: true.

