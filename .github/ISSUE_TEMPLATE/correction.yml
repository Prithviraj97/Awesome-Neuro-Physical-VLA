name: Correction
description: Report a wrong title, venue, category, note, or timing number
labels: [correction]
body:
  - type: input
    id: entry
    attributes: {label: Which entry?, description: Title or id}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: What is wrong and what should it say?}
    validations: {required: true}
  - type: input
    id: evidence
    attributes: {label: Evidence, description: Link, table or section number}
